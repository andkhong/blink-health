services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: blink_owner
      POSTGRES_PASSWORD: blink_owner
      POSTGRES_DB: blink
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink_owner -d blink"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
